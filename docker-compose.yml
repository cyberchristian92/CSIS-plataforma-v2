services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: csis_user
      POSTGRES_PASSWORD: csis_password
      POSTGRES_DB: csis_db
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csis_user -d csis_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://csis_user:csis_password@db:5432/csis_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-antes-de-usar-em-producao}
      JWT_EXPIRES_IN: "1d"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5174}
      PORT: 3000
      SEED_ADMIN_NOME: ${SEED_ADMIN_NOME:-Administrador}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@csis.local}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-TrocarSenha123}
      # Pasta compartilhada com o motor de laudo (serviço "pandoc" abaixo).
      LAUDO_WORKDIR: /work
      # "Entrar com Google" (opcional, ver .env.example).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - uploads:/app/uploads
      - ${LAUDO_VOLUME:-laudos}:/work
    restart: unless-stopped

  # Frontend em modo desenvolvimento (Vite com hot-reload): editar um arquivo
  # em web/src atualiza o navegador na hora. Não precisa de Node instalado na
  # máquina. As dependências ficam num volume próprio (web_node_modules), não
  # na pasta web/ — assim o node_modules do Linux do container não se mistura
  # com o do seu sistema.
  #
  # `npm ci`, não `npm install`: instala exatamente o package-lock.json sem
  # reescrevê-lo (o npm da imagem é outra versão e mexeria no arquivo de
  # quem só rodou o projeto). Só reinstala quando o node_modules ainda não
  # existe ou o package-lock.json mudou depois da última instalação.
  web:
    image: node:20-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        if [ ! -f node_modules/.package-lock.json ] || [ package-lock.json -nt node_modules/.package-lock.json ]; then
          npm ci
        fi
        exec npm run dev
    ports:
      - "${WEB_PORT:-5174}:5174"
    environment:
      VITE_HOST: 0.0.0.0
      API_PROXY_TARGET: http://backend:3000
      VITE_POLLING: ${VITE_POLLING:-false}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # Motor de compilação do Laudo Pericial (Markdown + front-matter Eisvogel ->
  # PDF): TeX Live "scheme-full" + Pandoc + template eisvogel.latex. Não é
  # chamado pelo backend via `docker exec`: os dois só dividem a pasta
  # /work, onde o backend deixa pedidos e o worker
  # (backend/pandoc/worker.sh) devolve o PDF. Sem rede — um laudo não tem
  # por que acessar a internet durante a compilação.
  #
  # A pasta é um volume nativo do Docker: é o que faz as permissões valerem
  # e isola uma compilação das outras. Só no desenvolvimento, com o backend
  # rodando fora do Docker, use LAUDO_VOLUME=./backend/laudo-workdir (no Mac
  # o Docker Desktop ignora permissões em pastas do host — aceitável só ali).
  pandoc:
    build:
      context: ./backend/pandoc
      dockerfile: Dockerfile
    container_name: csis_v2_pandoc_engine
    network_mode: none
    volumes:
      - ${LAUDO_VOLUME:-laudos}:/work
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  laudos:
  web_node_modules:
